quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:quarkus}
quarkus.datasource.password=${DB_PASSWORD:quarkus}
quarkus.datasource.jdbc.url=${DB_JDBC_URL:jdbc:postgresql://localhost:5432/quarkus_ms}
quarkus.datasource.devservices.enabled=false

quarkus.kubernetes.deployment-target=kubernetes
quarkus.kubernetes.name=quarkus-ms

quarkus.container-image.builder=docker
quarkus.container-image.group=dralquinta
quarkus.container-image.name=quarkus-ms
quarkus.container-image.tag=latest
quarkus.docker.buildx.platform=linux/arm64

quarkus.smallrye-openapi.info-title=Quarkus MS API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui
